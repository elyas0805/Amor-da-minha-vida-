<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elyas e Laura</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #FFE259, #FFA751, #FFB6C1);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            margin: 20px 0;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #FF7F50;
            margin-bottom: 20px;
            font-size: 26px;
        }

        input[type="password"], input[type="text"], select, textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 2px solid #FFB6C1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
        }

        input[type="password"] {
            text-align: center;
            font-size: 16px;
        }

        button {
            background-color: #FFA751;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            font-weight: bold;
            margin-top: 5px;
        }

        button:hover {
            background-color: #FF7F50;
        }

        .hidden {
            display: none;
        }

        hr {
            border: 0;
            height: 1px;
            background: #FFB6C1;
            margin: 20px 0;
        }

        /* Canvas para chuva de corações */
        #heart-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #FFB6C1;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <canvas id="heart-canvas"></canvas>

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="container">
        <h1>Elyas e Laura</h1>
        <p style="font-size: 15px; color: #555;">Insira a data do início de tudo para entrar:</p>
        <input type="password" id="password-input" placeholder="DDMMAAAA" maxlength="8">
        <button onclick="checkPassword()">Entrar</button>
        <p id="error-message" style="color: red; font-size: 14px; margin-top: 10px; font-weight: bold;"></p>
    </div>

    <!-- PAINEL PRINCIPAL -->
    <div id="main-content" class="container hidden">
        <h1>Elyas & Laura</h1>
        <p style="font-size: 14px; color: #666; margin-top: -10px;">Início do namoro: 08/05/2026</p>
        
        <!-- Contador de dias -->
        <div id="counter" style="font-size: 24px; font-weight: bold; margin: 15px 0; color: #FFA751;"></div>

        <hr>

        <!-- STATUS DE HUMOR -->
        <div id="status-section" style="text-align: left;">
            <h3 style="color: #FF7F50; text-align: center; margin-top: 0;">Como estamos hoje?</h3>
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <div style="flex: 1; background: #FFFDE7; padding: 10px; border-radius: 8px; border: 1px solid #FFA751;">
                    <strong style="font-size: 12px; color: #FFA751;">Elyas:</strong>
                    <div id="elyas-status-view" style="font-size: 15px; margin-top: 5px;">Carregando...</div>
                </div>
                <div style="flex: 1; background: #FFF0F5; padding: 10px; border-radius: 8px; border: 1px solid #FFB6C1;">
                    <strong style="font-size: 12px; color: #FFB6C1;">Laura:</strong>
                    <div id="laura-status-view" style="font-size: 15px; margin-top: 5px;">Carregando...</div>
                </div>
            </div>
            <div style="display: flex; gap: 5px;">
                <select id="user-select" style="width: 35%;">
                    <option value="Elyas">Elyas</option>
                    <option value="Laura">Laura</option>
                </select>
                <select id="mood-select" style="width: 65%;">
                    <option value="🥰 Com muita saudade">🥰 Com muita saudade</option>
                    <option value="❤️ Te amo cada vez mais">❤️ Te amo cada vez mais</option>
                    <option value="🫠 Querendo cafuné">🫠 Querendo cafuné</option>
                    <option value="🍕 Pensando em comer juntos">🍕 Pensando em comer juntos</option>
                    <option value="😴 Cansado(a), preciso de você">😴 Cansado(a), preciso de você</option>
                </select>
            </div>
            <button onclick="updateMood()" style="padding: 8px; font-size: 13px;">Atualizar Meu Status</button>
        </div>

        <hr>

        <!-- ORÁCULO DO AMOR (IA) -->
        <div id="oracle-section" style="text-align: left;">
            <h3 style="color: #FF7F50; text-align: center; margin-top: 0;">Oráculo do Amor</h3>
            <p style="font-size: 12px; color: #666; text-align: center; margin-top: -5px;">Faça uma pergunta sobre o nosso futuro:</p>
            <input type="text" id="oracle-question" placeholder="Ex: Vamos nos ver hoje?">
            <button onclick="askOracle()" style="padding: 10px; background-color: #FFB6C1;">Perguntar ao Oráculo</button>
            <div id="oracle-response" style="margin-top: 10px; padding: 10px; border-radius: 8px; background: #FAF9F6; font-style: italic; text-align: center; font-size: 14px; min-height: 20px; color: #444; border-left: 4px solid #FF7F50;">
                O Oráculo aguarda sua dúvida...
            </div>
        </div>

        <hr>
        
        <!-- SISTEMA DE MENSAGENS -->
        <div id="messages-section" style="text-align: left;">
            <h3 style="color: #FF7F50; text-align: center; margin-top: 0;">Nossas Mensagens</h3>
            <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px;">
                <select id="message-author" style="background: white;">
                    <option value="Elyas">De: Elyas</option>
                    <option value="Laura">De: Laura</option>
                </select>
                <textarea id="message-text" placeholder="Escreva um recado bonito..." rows="3" style="resize: none; font-family: sans-serif;"></textarea>
                <button onclick="saveMessage()">Enviar Mensagem</button>
            </div>
            <div id="messages-list" style="max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px;"></div>
        </div>

        <hr>

        <!-- MINI GALERIA DE FOTOS -->
        <div id="gallery-section" style="text-align: left;">
            <h3 style="color: #FF7F50; text-align: center; margin-top: 0;">Nossa Galeria</h3>
            <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px;">
                <label for="image-input" style="background-color: #FFB6C1; color: white; padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; font-size: 14px; font-weight: bold; display: block;">
                    Selecionar Foto ou Print
                </label>
                <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="savePhoto()">
            </div>
            <div id="gallery-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-height: 220px; overflow-y: auto; padding-right: 5px;"></div>
        </div>
    </div>

    <script>
        // Sistema de Senha
        function checkPassword() {
            const input = document.getElementById('password-input').value;
            const correctPassword = "08052026";

            if (input === correctPassword) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                
                updateCounter();
                loadMessages();
                loadPhotos();
                loadMoods();
                startHeartRain(); // Inicia efeito visual
            } else {
                document.getElementById('error-message').innerText = "Senha incorreta. Tente formatar como DDMMAAAA.";
            }
        }

        // Contador de Dias
        function updateCounter() {
            const startDate = new Date(2026, 4, 8); 
            const today = new Date();
            const differenceInTime = today - startDate;
            const differenceInDays = Math.floor(differenceInTime / (1000 * 60 * 60 * 24));
            const counterElement = document.getElementById('counter');
            
            if (differenceInDays < 0) {
                counterElement.innerText = "O grande dia está chegando!";
            } else if (differenceInDays === 0) {
                counterElement.innerText = "Começou hoje! ❤️";
            } else {
                counterElement.innerText = `${differenceInDays} dias juntos ❤️`;
            }
        }

        // Controle de Humor / Status
        function updateMood() {
            const user = document.getElementById('user-select').value;
            const mood = document.getElementById('mood-select').value;
            
            localStorage.setItem(`mood_${user}`, mood);
            loadMoods();
        }

        function loadMoods() {
            const elyasMood = localStorage.getItem('mood_Elyas') || "Não definido ainda";
            const lauraMood = localStorage.getItem('mood_Laura') || "Não definido ainda";
            
            document.getElementById('elyas-status-view').innerText = elyasMood;
            document.getElementById('laura-status-view').innerText = lauraMood;
        }

        // Lógica do Oráculo (Pseudo-IA)
        function askOracle() {
            const question = document.getElementById('oracle-question').value.trim();
            if (question === "") {
                alert("Pergunte algo ao Oráculo!");
                return;
            }

            const responses = [
                "Com certeza, o destino conspira a nosso favor! ❤️",
                "O futuro diz que isso vai te custar um cafuné demorado. 🥰",
                "Sim, e com direito a muitos beijos. 💋",
                "As estrelas dizem que sim, mas você tem que pagar a pizza. 🍕",
                "Completamente provável, afinal a gente se sintoniza perfeitamente.",
                "Não tenha dúvidas, meu coração já confirmou isso hoje. 👀",
                "O Oráculo parou para admirar nossa foto e esqueceu de prever. Mas a resposta deve ser sim!"
            ];

            const randomIndex = Math.floor(Math.random() * responses.length);
            document.getElementById('oracle-response').innerText = responses[randomIndex];
            document.getElementById('oracle-question').value = "";
        }

        // Sistema de Mensagens
        function saveMessage() {
            const author = document.getElementById('message-author').value;
            const text = document.getElementById('message-text').value.trim();

            if (text === "") return;

            let messages = JSON.parse(localStorage.getItem('love_messages')) || [];
            const newMessage = { author, text, date: new Date().toLocaleDateString('pt-BR') };

            messages.unshift(newMessage);
            localStorage.setItem('love_messages', JSON.stringify(messages));
            document.getElementById('message-text').value = "";
            loadMessages();
        }

        function loadMessages() {
            const messagesList = document.getElementById('messages-list');
            let messages = JSON.parse(localStorage.getItem('love_messages')) || [];
            messagesList.innerHTML = "";

            if (messages.length === 0) {
                messagesList.innerHTML = `<p style="color: #999; text-align: center; font-style: italic; font-size: 14px; margin: 10px 0;">Nenhuma mensagem ainda. ❤️</p>`;
                return;
            }

            messages.forEach(msg => {
                const msgBox = document.createElement('div');
                const isElyas = msg.author === "Elyas";
                
                msgBox.style.background = isElyas ? "#FFFDE7" : "#FFF0F5"; 
                msgBox.style.padding = "10px";
                msgBox.style.borderRadius = "8px";
                msgBox.style.borderLeft = isElyas ? "4px solid #FFA751" : "4px solid #FFB6C1";
                msgBox.style.fontSize = "14px";

                msgBox.innerHTML = `
                    <strong>${msg.author}</strong> <span style="font-size: 11px; color: #777; float: right;">${msg.date}</span>
                    <p style="margin: 5px 0 0 0; word-break: break-word; color: #444;">${msg.text}</p>
                `;
                messagesList.appendChild(msgBox);
            });
        }

        // Sistema da Galeria de Fotos
        function savePhoto() {
            const fileInput = document.getElementById('image-input');
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onloadend = function() {
                let photos = JSON.parse(localStorage.getItem('love_photos')) || [];
                photos.unshift(reader.result);
                localStorage.setItem('love_photos', JSON.stringify(photos));
                fileInput.value = "";
                loadPhotos();
            };
            reader.readAsDataURL(file);
        }

        function loadPhotos() {
            const galleryGrid = document.getElementById('gallery-grid');
            let photos = JSON.parse(localStorage.getItem('love_photos')) || [];
            galleryGrid.innerHTML = "";

            if (photos.length === 0) {
                galleryGrid.innerHTML = `<p style="color: #999; text-align: center; font-style: italic; font-size: 14px; grid-column: span 2; margin: 10px 0;">Nenhuma foto ainda. 📸</p>`;
                return;
            }

            photos.forEach(photoData => {
                const imgWrapper = document.createElement('div');
                imgWrapper.style.position = "relative";
                imgWrapper.style.width = "100%";
                imgWrapper.style.paddingTop = "100%"; 
                imgWrapper.style.borderRadius = "8px";
                imgWrapper.style.overflow = "hidden";

                const img = document.createElement('img');
                img.src = photoData;
                img.style.position = "absolute";
                img.style.top = "0"; img.style.left = "0";
                img.style.width = "100%"; img.style.height = "100%";
                img.style.objectFit = "cover";

                imgWrapper.appendChild(img);
                galleryGrid.appendChild(imgWrapper);
            });
        }

        // Chuva de Corações (Canvas Animado)
        function startHeartRain() {
            const canvas = document.getElementById('heart-canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const hearts = [];
            const heartColors = ['#FFB6C1', '#FFA751', '#FFE259'];

            class Heart {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * -canvas.height - 20;
                    this.size = Math.random() * 10 + 8;
                    this.speed = Math.random() * 2 + 1;
                    this.color = heartColors[Math.floor(Math.random() * heartColors.length)];
                    this.opacity = Math.random() * 0.5 + 0.5;
                }

                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.opacity;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    // Desenha o formato do coração simplificado via curvas bezier
                    ctx.bezierCurveTo(this.x - this.size/2, this.y - this.size/2, this.x - this.size, this.y + this.size/3, this.x, this.y + this.size);
                    ctx.bezierCurveTo(this.x + this.size, this.y + this.size/3, this.x + this.size/2, this.y - this.size/2, this.x, this.y);
                    ctx.fill();
                    ctx.restore();
                }

                update() {
                    this.y += this.speed;
                    if (this.y > canvas.height) {
                        this.y = -20;
                        this.x = Math.random() * canvas.width;
                    }
                }
            }

            for (let i = 0; i < 30; i++) {
                hearts.push(new Heart());
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                hearts.forEach(heart => {
                    heart.update();
                    heart.draw();
                });
                requestAnimationFrame(animate);
            }
            animate();

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }
    </script>
</body>
</html>
